<style> 
.auth-container {
    height: 85vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, black,grey, black);
   
}
.so{
    display: grid;
    grid-template-columns: repeat(2,1fr);
    
}

.auth-box {
    padding: 40px;
    /* border-radius: 10px; */
    width: 420px;
    height: 520px;
    text-align: center;
    box-shadow: 0px 0px 8px ;
    border-radius: 0 100px 0 100px ;
    border: 2px solid orangered;


    
}

.auth-box h2 {
    margin-top: 40px;
    color: black;

}

.auth-box input {
    width: 70%;
    padding: 10px;
    margin: 10px 0;
    border: 1px solid black;
    border-radius: 5px;
    outline: none;

}

.auth-box input:focus {
    border-color: red;
}

.auth-box button {
    width: 70%;
    padding: 10px;
    background: orangered;
    color: white;
    border-radius: 5px;
    margin-top: 10px;
    cursor: pointer;
}

.auth-box button:hover {
    background-color:red;
}

.auth-box p {
    margin: 10px;
    font-size: 14px;
    color: aliceblue;

}

.auth-box a {
    color: red;
    text-decoration: none;
} 


</style>
