<style>   
.auth-container {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, black, grey);
}

.auth-box {
    background-color: white;
    padding: 40px;
    border-radius: 10px;
    width: 320px;
    text-align: center;
    box-shadow: 0px 8px 30px lightyellow;
}

.auth-box h2 {
    margin-bottom: 20px;
    color: black;

}

.auth-box input {
    width: 100%;
    padding: 10px;
    margin: 10px 0;
    border: 1px solid black;
    border-radius: 5px;
    outline: none;

}

.auth-box input:focus {
    border-color: red;
}

.auth-box button {
    width: 100%;
    padding: 10px;
    background: red;
    color: white;
    border-radius: 5px;
    margin-top: 10px;
    cursor: pointer;
}

.auth-box button:hover {
    background-color: #cc0000;
}

.auth-box p {
    margin-top: 15px;
    font-size: 14px;

}

.auth-box a {
    color: red;
    text-decoration: none;
}  
</style>    
</head>

        <form>
