<style>
   .product-container {
  max-width: 1000px;
  margin: 0 auto;
  font-family: sans-serif;
}

/* Image Gallery */
.image-gallery {
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  margin-bottom: 30px;
}
.image-gallery img {
  width: 100%;
  max-height: 500px;
  object-fit: cover;
}
.nav-btn {
  position: absolute;
  background: black;
  color: white;
  border-radius: 50%;
  border: none;
  width: 40px;
  height: 40px;
  cursor: pointer;
}
.nav-btn.left { left: 10px; }
.nav-btn.right { right: 10px; }

/* Typography */
.product-title {
  text-align: center;
  text-transform: uppercase;
  margin-bottom: 30px;
  letter-spacing: 1px;
}

/* Grid Layouts */
.specs-grid, .pricing-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 20px;
  margin-bottom: 20px;
}
.pricing-grid {
  grid-template-columns: repeat(2, 1fr);
  max-width: 600px;
  margin: 0 auto 30px auto;
}

/* Spec Cards */
.spec-card {
  background-color: #f7f7f7;
  padding: 15px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}
.spec-label {
  font-weight: 600;
  color: #333;
  margin-bottom: 10px;
  padding-bottom: 10px;
  border-bottom: 1px dashed #ccc; /* Dashed line matching the design */
  width: 80%;
}
.spec-value {
  color: #a87d60; /* The brownish copper text color */
  font-weight: 600;
  text-transform: uppercase;
}

/* Action Buttons */
.action-buttons {
  display: flex;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
}
.action-buttons button {
  background-color: #8c6a51;
  color: white;
  border: none;
  padding: 12px 24px;
  cursor: pointer;
  font-weight: bold;
}
.action-buttons button:hover {
  background-color: #705541;
}
    
    

   
</style>
        
   
    
        
    
</head>
